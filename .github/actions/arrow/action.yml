name: Install Apache Arrow
description: Install libarrow from the Apache Arrow apt repository
inputs:
  build-tools:
    description: Also install cmake, g++, and make
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install libarrow
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        packages=(ca-certificates lsb-release wget)
        if [[ "${{ inputs.build-tools }}" == "true" ]]; then
          packages+=(cmake g++ make)
        fi
        sudo apt-get install -y -V "${packages[@]}"
        codename="$(lsb_release --codename --short)"
        distro="$(lsb_release --id --short | tr 'A-Z' 'a-z')"
        deb="$(mktemp --suffix=.deb)"
        wget -O "$deb" "https://apache.jfrog.io/artifactory/arrow/${distro}/apache-arrow-apt-source-latest-${codename}.deb"
        sudo apt-get install -y -V "$deb"
        sudo apt-get update
        sudo apt-get install -y -V libarrow-dev
        rm -f "$deb"
